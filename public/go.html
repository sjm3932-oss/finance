<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>부부 자산 마스터</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
      background: linear-gradient(180deg, #F2FBF6 0%, #F4F6F5 55%, #EEF2F0 100%);
      color: #1A1A1A;
    }
    .card {
      width: min(420px, 92vw); padding: 28px 22px; border-radius: 20px;
      background: #fff; box-shadow: 0 12px 40px rgba(3,199,90,.12);
      border: 1px solid #E5E7EB;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; letter-spacing: -0.02em; }
    p { margin: 0 0 18px; color: #6B7280; line-height: 1.5; font-size: .95rem; }
    .brand { color: #03C75A; font-weight: 800; font-size: .85rem; margin-bottom: 10px; }
    button, a.btn {
      display: block; width: 100%; box-sizing: border-box; text-align: center;
      text-decoration: none; border: 0; border-radius: 14px; padding: 14px 16px;
      font-size: 1rem; font-weight: 700; color: #fff; cursor: pointer;
      background: linear-gradient(180deg, #03C75A, #02B350);
      box-shadow: 0 8px 20px rgba(3,199,90,.28);
    }
    .muted { margin-top: 14px; font-size: .8rem; color: #9CA3AF; word-break: break-all; }
    .err { color: #B91C1C; margin-top: 12px; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Couples Wealth Master</div>
    <h1>앱으로 이동 중…</h1>
    <p id="msg">최신 접속 주소를 확인한 뒤 자동으로 이동합니다.</p>
    <button id="go" type="button" hidden>앱 열기</button>
    <div class="muted" id="target"></div>
    <div class="err" id="err"></div>
  </div>
  <script>
    // Anon key is public by design (RLS protects data). Used only to read app_runtime.public_url.
    const SUPABASE_URL = "https://lsqkixysysfhywipmrky.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Pu51AiA_vT3OjJrChmVovw_S0pn1iX0";

    function qs() {
      return new URLSearchParams(window.location.search);
    }
    function hashParams() {
      const h = window.location.hash.replace(/^#/, "");
      return new URLSearchParams(h);
    }
    function mergeAuthParams() {
      const out = new URLSearchParams();
      const sources = [qs(), hashParams()];
      for (const src of sources) {
        for (const key of ["code", "access_token", "refresh_token", "expires_in", "token_type", "provider_token", "type"]) {
          if (src.has(key) && !out.has(key)) out.set(key, src.get(key));
        }
      }
      return out;
    }

    async function fetchAppUrl() {
      const res = await fetch(
        SUPABASE_URL + "/rest/v1/app_runtime?id=eq.1&select=public_url",
        {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY,
          },
          cache: "no-store",
        }
      );
      if (!res.ok) throw new Error("runtime lookup failed: " + res.status);
      const rows = await res.json();
      if (!rows.length || !rows[0].public_url) throw new Error("앱 주소가 아직 등록되지 않았습니다.");
      return String(rows[0].public_url).replace(/\/$/, "");
    }

    function buildTarget(appUrl) {
      const auth = mergeAuthParams();
      const u = new URL(appUrl);
      // Prefer query for Streamlit (reads st.query_params).
      for (const [k, v] of auth.entries()) u.searchParams.set(k, v);
      return u.toString();
    }

    async function main() {
      const msg = document.getElementById("msg");
      const err = document.getElementById("err");
      const go = document.getElementById("go");
      const target = document.getElementById("target");
      try {
        const appUrl = await fetchAppUrl();
        const dest = buildTarget(appUrl);
        target.textContent = appUrl;
        go.hidden = false;
        go.onclick = () => { window.location.replace(dest); };
        msg.textContent = mergeAuthParams().toString()
          ? "로그인 정보를 전달하며 앱으로 이동합니다…"
          : "최신 접속 주소로 이동합니다…";
        // Auto-follow; button remains as fallback.
        window.location.replace(dest);
      } catch (e) {
        msg.textContent = "자동 이동에 실패했습니다. 잠시 후 다시 시도하세요.";
        err.textContent = String(e && e.message ? e.message : e);
      }
    }
    main();
  </script>
</body>
</html>
