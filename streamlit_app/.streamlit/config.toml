[server]
headless = true
enableStaticServing = true
enableWebsocketCompression = true
# Faster feedback over remote tunnels
maxMessageSize = 200

[browser]
gatherUsageStats = false

[runner]
fastReruns = true

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
primaryColor = "#03C75A"
backgroundColor = "#F4F6F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"
font = "sans serif"
