name: Toss sync cloud worker

on:
  workflow_dispatch:
  repository_dispatch:
    types: [toss-sync]
  schedule:
    - cron: "0 23 * * *"

jobs:
  sync:
    runs-on: [self-hosted, toss]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
      TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install supabase python-dotenv
      - name: Sync holdings and filled orders from this runner's static IP
        run: python3 scripts/sync_toss.py
