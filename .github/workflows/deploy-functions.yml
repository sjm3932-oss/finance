name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy-toss-sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lsqkixysysfhywipmrky
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "GitHub repo secret SUPABASE_ACCESS_TOKEN 이 없습니다."
            echo "https://supabase.com/dashboard/account/tokens 에서 토큰을 만든 뒤"
            echo "https://github.com/sjm3932-oss/finance/settings/secrets/actions 에 추가하세요."
            exit 1
          fi

      - name: Deploy toss-sync
        run: supabase functions deploy toss-sync --project-ref "$PROJECT_REF"
