name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lsqkixysysfhywipmrky
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "GitHub repo secret SUPABASE_ACCESS_TOKEN 이 없습니다."
            echo "Cloud Agent / 로컬에서 이미 배포했다면 이 워크플로는 건너뜁니다."
            echo "토큰을 쓰려면 https://supabase.com/dashboard/account/tokens 에서 만든 뒤"
            echo "https://github.com/sjm3932-oss/finance/settings/secrets/actions 에 추가하세요."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy toss-sync
        if: steps.token.outputs.skip != '1'
        run: supabase functions deploy toss-sync --project-ref "$PROJECT_REF"

      - name: Deploy kis-sync
        if: steps.token.outputs.skip != '1'
        run: supabase functions deploy kis-sync --project-ref "$PROJECT_REF"
